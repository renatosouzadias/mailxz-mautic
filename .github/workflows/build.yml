name: build-image
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/renatosouzadias/mailxz-mautic:v4.4.12
            ghcr.io/renatosouzadias/mailxz-mautic:latest
      - name: Atualiza a instancia DEMO (espelha a imagem)
        run: |
          curl -sf -m 60 -X POST "https://orquestrador.exz.digital/admin/reprovision" \
            -H "x-secret: ${{ secrets.ORCH_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"slug":"demo","email":"renatosouzadias@gmail.com"}' || echo "reprovision demo falhou (nao bloqueia o build)"
